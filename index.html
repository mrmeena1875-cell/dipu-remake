<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deepesh Meena Remake 2026 — 3D Escape</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #070b14; color: #fff; overflow: hidden;
      width: 100vw; height: 100vh; user-select: none;
    }
    .screen {
      position: fixed; inset: 0; z-index: 25;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1e293b 0%, #070b14 75%);
      text-align: center; padding: 20px;
    }
    .hidden { display: none !important; }
    .badge {
      background: rgba(250, 204, 21, 0.14); border: 1px solid rgba(250, 204, 21, 0.45);
      color: #fde047; padding: 6px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(30px, 6vw, 54px); font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #facc15, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .sub { color: #cbd5e1; max-width: 560px; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    button {
      background: #2563eb; color: #fff; border: none; padding: 11px 20px;
      border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #334155; }
    button.secondary:hover:not(:disabled) { background: #475569; }
    button.green { background: #16a34a; }
    button.green:hover:not(:disabled) { background: #15803d; }
    button.selected-diff { outline: 3px solid #facc15; background: #16a34a; }

    #hud {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .pill {
      background: rgba(15, 23, 42, 0.84); border: 1px solid rgba(255,255,255,0.16);
      padding: 7px 14px; border-radius: 999px; font-size: 13px; backdrop-filter: blur(6px);
    }
    #helpBar {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15, 23, 42, 0.84); border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 16px; border-radius: 999px; font-size: 12px; color: #e2e8f0;
      white-space: nowrap; pointer-events: none;
    }
    #toast {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 15;
      background: rgba(239, 68, 68, 0.94); color: #fff; padding: 7px 16px;
      border-radius: 9px; font-size: 13px; font-weight: 700; display: none;
    }
    #shopModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      z-index: 35; align-items: center; justify-content: center;
    }
    #shopBox {
      background: #1e293b; border: 1px solid #475569; border-radius: 14px;
      padding: 20px; width: min(92vw, 480px); text-align: left;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 10px 12px; border-radius: 8px; margin-top: 10px;
    }
    #endOverlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      z-index: 20; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- 1. Start Screen -->
  <div id="startScreen" class="screen">
    <div class="badge">⚡ 3D EDITION • DEEPESH MEENA REMAKE 2026</div>
    <h1>DEEPESH MEENA REMAKE 2026</h1>
    <p class="sub">
      3D एरिना में कॉइन्स इकट्ठा करो, लावा के गड्ढों और घोस्ट से बचो, हर 10 सेकंड में मैप शफल होता है, और नई बाइक व सुपरकार अनलॉक करो!
    </p>
    <div class="btn-row">
      <button class="green" onclick="goToDifficulty()">▶ Play Now</button>
      <button class="secondary" onclick="toggleShop()">🛒 Garage</button>
    </div>
  </div>

  <!-- 2. Difficulty Screen -->
  <div id="diffScreen" class="screen hidden">
    <div class="badge">🎯 SELECT DIFFICULTY</div>
    <h1 style="font-size: clamp(26px, 5vw, 42px);">
